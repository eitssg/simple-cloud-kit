[project]
name = "simple-cloud-kit"
version = "1.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
   "tomlkit",
   "esbonio",
   "pytest-env>=1.1.5",
   "pytest-cov>=7.0.0",
   "rich>=14.1.0",
   "cfn-lint>=1.40.0",
   "pydot>=4.0.1",
   "requests (>=2.32.3)",
   "cattrs (>=23.1.2)",
   "sphinx (>=8.1.3)",
   "myst-parser (>=4.0.0)",
   "sphinx-rtd-theme (>=3.0.2)",
   "sphinx-design (>=0.6.1)",
   "sphinxcontrib-openapi (>=0.8.4)",
   "sphinxcontrib-napoleon (>=0.7)",
   "python-docs-theme>=2025.2",
   "pytest>=8.3.3",
   "flake8>=7.1.1",
   "cfn-lint>=1.22",
   "pytest-asyncio>=0.25.0",
   "boto3-stubs>=1.34.51",
   "pytest-dotenv>=0.5.2",
   "pytest-cov>=6.0.0",
   "black>=25.9.0",
   "uvicorn>=0.37.0",
]

[tool.hatch.build.targets.wheel]
packages = ["simple_cloud_kit"]


[tool.black]
line-length = 132
target-version = ["py311"]
skip-string-normalization = true
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | build
  | dist
  | venv
  | \.venv
)/
'''
extend-exclude = '''
/(
    tests
)/
'''

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

