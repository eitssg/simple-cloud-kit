[project]
name = "simple-cloud-kit"
version = "1.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "tomlkit",
    "black",
    "pytest",
    "esbonio",
    "pytest-env>=1.1.5",
    "pytest-cov>=7.0.0",
    "console>=0.9911",
    "rich>=14.1.0",
    "cfn-lint>=1.40.0",
    "pydot>=4.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["simple_cloud_kit"]


[tool.black]
line-length = 132
target-version = ["py311"]
skip-string-normalization = true
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | build
  | dist
  | venv
  | \.venv
)/
'''
extend-exclude = '''
/(
    tests
)/
'''

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

