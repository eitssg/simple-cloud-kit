global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: "fastapi"
    metrics_path: "/metrics"
    static_configs:
      # On macOS, Docker can reach the host via host.docker.internal
      - targets: ["host.docker.internal:8090"]
